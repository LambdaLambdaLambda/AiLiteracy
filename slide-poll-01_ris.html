<script>
// Lettura della tabella "Form_Responses" dal foglio Google delle risposte.
// Il foglio è condiviso con "chiunque abbia il link", quindi la scheda si scarica come CSV
// senza bisogno di accesso. La pagina va aperta da un server web (http/https), non da file://.
const SPREADSHEET_ID = '1bKw83ar58o5PSWe8Q6JQNnkK5cWAGgrvl6C2qTtfZj8';
const SHEET_GID = 271731494;              // scheda del foglio che contiene la tabella Form_Responses
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${SHEET_GID}`;
const REFRESH_SECONDS = 20;

let formResponses = [];                   // lista di record: un oggetto per risposta, campi = nomi delle colonne

// CSV con campi tra virgolette, virgole e ritorni a capo dentro le risposte
function parseCsv(text) {
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

// Legge la tabella e la trasforma in lista di record
async function readFormResponses() {
  const res = await fetch(CSV_URL, { cache: 'no-store' });
  if (!res.ok) { const err = new Error('HTTP ' + res.status); err.status = res.status; throw err; }
  const [header = [], ...rows] = parseCsv(await res.text());
  return rows
    .filter(row => row.some(cell => cell.trim() !== ''))
    .map(row => Object.fromEntries(header.map((name, i) => [name.trim(), row[i] ?? ''])));
}

async function refresh() {
  try {
    formResponses = await readFormResponses();
    window.formResponses = formResponses;
    pollRender(formResponses);
    const now = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    pollStatus(`Aggiornato alle ${now} · si aggiorna da solo ogni ${REFRESH_SECONDS} secondi`);
  } catch (e) {
    if (location.protocol === 'file:') pollStatus('Apri questa pagina da un server web (ad esempio http://localhost:8000): da file:// il browser blocca la lettura del foglio.');
    else if (e.status) pollStatus('Non riesco a leggere il foglio (' + e.message + '): controlla che sia ancora condiviso con chiunque abbia il link.');
    else pollStatus('Non riesco a leggere il foglio: controlla la connessione e che sia ancora condiviso con chiunque abbia il link.');
  }
}

refresh();
setInterval(refresh, REFRESH_SECONDS * 1000);
</script>
