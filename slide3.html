<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide 3</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f8fafc;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 32px;
      text-align: center;
    }
    .panel {
      max-width: 760px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 42px;
      box-shadow: 0 20px 80px rgba(15, 23, 42, 0.24);
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.3rem, 4vw, 3.5rem);
    }
    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.75;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Final Summary</h1>
    <p>All slides use a consistent wrapper style and the main app keeps the sidebar fixed while the iframe content changes.</p>
  </div>
</body>
</html>
