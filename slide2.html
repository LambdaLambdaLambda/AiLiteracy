<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide 2</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #0f172a 55%, #1d4ed8 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .card {
      background: rgba(15, 23, 42, 0.88);
      border-radius: 24px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      box-shadow: 0 25px 80px rgba(15, 23, 42, 0.28);
      padding: 40px;
      max-width: 720px;
      width: 100%;
    }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 4vw, 3.5rem);
    }
    ul {
      margin: 0;
      padding-left: 20px;
      color: #cbd5e1;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Presentation Goals</h1>
    <ul>
      <li>Keep the left navigation fixed at 20% width.</li>
      <li>Render each slide inside the right iframe area.</li>
      <li>Highlight the current slide in the sidebar.</li>
      <li>Support both local content and external website slides.</li>
    </ul>
  </div>
</body>
</html>
