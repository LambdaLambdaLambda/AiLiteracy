<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide 1</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f8fafc;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 32px;
      text-align: center;
    }
    .slide {
      max-width: 760px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1.05;
    }
    p {
      margin: 0;
      font-size: 1.05rem;
      color: #cbd5e1;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="slide">
    <h1>Welcome to the Presentation</h1>
    <p>This is a fully wrapped slide inside the iframe. Use the left menu or the buttons to move through the deck.</p>
  </div>
</body>
</html>
